name: atmospheric-fields
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pandas
  - matplotlib
  - cartopy
  - xarray
  - netcdf4
  - tqdm
  - pip

# Base directory for all default NetCDF inputs. Defaults to ./data unless the
# DATA_DIR environment variable is set.
data_dir: ${oc.env:DATA_DIR,data}

# Canonical recurring temporal protocol. Forecast membership is determined by
# initialization time plus lead, and every forecast sample must match ERA5 at
# that exact valid timestamp.
monthly_split:
  strategy: monthly_valid_time
  train_days: [1, 15]
  test_days: [20, 26]
  null_comparison_days: [16, 31]
  corruption_time_range: ["2004-01-01", "2022-12-31"]
  model_valid_time_ranges:
    - ["2020-01-01", "2020-12-31"]
  require_exact_era5_match: true

# Repeated within-month holdouts used for uncertainty estimates. Child runs
# receive one active_schedule; leave it null in the parent invocation.
temporal_resampling:
  enabled: true
  learned_replicates: 5
  fixed_replicates: 10
  learned_test_windows: [[5, 11], [9, 15], [13, 19], [17, 23], [20, 26]]
  buffer_days: 4
  random_test_start_range: [5, 20]
  seed: 0
  active_schedule: null
  input_run_dir: null

# ERA5/reference file used for training real samples.
real_nc_file: "${data_dir}/era5_1.5deg_2004-01-01_2023-12-31.nc"

# Forecast files used as fake samples during discriminator training. This can be
# a single string or a YAML list.
fake_nc_file:
  - "${data_dir}/pangu_6steps_surf_1.5deg_2020-01-01_2020-12-31.nc"
  - "${data_dir}/fuxi_6steps_surf_1.5deg_2020-01-01_2020-12-31.nc"

# Files used by scripts/evaluate_discriminator.py for a held-out real/fake test set.
test_real_nc_file: "${data_dir}/era5_1.5deg_2004-01-01_2023-12-31.nc"
test_fake_nc_file: "${data_dir}/graphcast_6steps_surf_1.5deg_2018-01-01_2018-12-31.nc"

# Input channels. Set `variables: null` to train/evaluate with only
# `selected_variable`.
variables:
  - "2m_temperature"
  - "10m_u_component_of_wind"
  - "10m_v_component_of_wind"
  - "mean_sea_level_pressure"

# Field used by single-variable analysis scripts and output filenames.
selected_variable: "mean_sea_level_pressure"

# Optional pressure level selector for upper-air data. Leave null for surface
# fields or files without a level dimension.
level: null

# Legacy range keys retained for poster and k-fold compatibility. Canonical
# config.yaml workflows use monthly_split above instead.
train_real_range:
  - ["2008-01-01", "2017-12-31"]
  - ["2020-01-01", "2020-12-31"]

# Legacy forecast training range (ignored by monthly_valid_time workflows).
train_fake_range: ["2020-01-01", "2020-12-31"]

# Legacy reference holdout ranges (ignored by monthly_valid_time workflows).
test_real_ranges:
  - [null, "2007-12-31"]
  - ["2018-01-01", "2019-12-31"]
  - ["2021-01-01", null]

# Legacy forecast holdout range (ignored by monthly_valid_time workflows).
test_fake_range: ["2018-01-01", "2019-12-31"]

# Forecast lead times, in hours, to include from files with a
# prediction_timedelta dimension.
lead_times: [6, 12, 24, 48, 96, 192]

# Analysis subsample cap. `0` means use all available samples; plotting scripts
# may still impose their own small defaults for expensive visual grids.
max_samples: 0

# Samples per optimizer step or inference batch.
batch_size: 64

# Number of full training epochs.
epochs: 10

# AdamW learning rate.
learning_rate: 1e-4

# Backbone architecture. Supported values: "squeezenet", "resnet18".
model_name: "squeezenet"

# DataLoader worker processes.
num_workers: 4

# If true, fake samples include model forecasts, corrupted ERA5, and corrupted
# forecasts. If false, only model forecasts are labeled fake.
augment: true

# Probability of corrupting a sample in unbalanced/evaluation dataset mode.
# Balanced training uses the explicit fake category mixture instead.
augment_prob: 0.5

# Probability that each channel is selected when applying a fieldwise corruption.
# At least one channel is always corrupted.
field_corruption_prob: 0.5

# Training-time corruption pool. Fieldwise options can corrupt selected channels;
# wind options operate on the paired U/V wind channels.
corruption_types:
  - "blur"
  - "grf"
  - "pixel_replace"
  - "wind_patch_shuffle"

# Maximum sampled corruption severity.
corruption_severity_max: 1.0

# Severity sampler exponent. Values > 1 bias samples toward weaker corruptions.
corruption_severity_power: 2.0

# Optional training-only logical-severity bounds. Gaussian blur itself maps any
# positive logical severity onto its useful physical range while preserving an
# exact identity at zero, so it needs no separate sampling floor here.
corruption_severity_min: 0.0
corruption_severity_min_overrides: {}

# Optional fixed corruption override for targeted disturbance training/evaluation.
# Leave null/0.0 for the random corruption policy.
disturb_type: null
disturb_level: 0.0

# Lightning precision setting. The trainer falls back to 32-bit on CPU.
precision: "16-mixed"

# Logging
#   csv: local CSV logs under output_dir/lightning_logs (default, no W&B needed)
#   wandb: log to Weights & Biases using project_name
#   none: disable Lightning experiment logging
logger: "csv"

# W&B project name when logger="wandb"; also used as the base name for k-fold
# project overrides.
project_name: "weather-discriminator"

# Destination for model weights, plots, local CSV logs, and cache files.
output_dir: "results"

# Destination for temporal holdout experiment checkpoints. Plots remain under
# `output_dir`.
temporal_checkpoint_dir: "${output_dir}/temporal_holdout_checkpoints"

# Held-out forecast examples for plot_temporal_logit_map_case_study.py. Leave
# `case_study_variables` null to use the configured fields, with an automatic
# fallback to the selected-variable checkpoint when that is what is available.
case_study_model: "GraphCast"
case_study_lead_hour: 24
case_study_logit_quantiles: [0.05, 0.5, 0.95]
case_study_batch_size: 64
# Optional UTC initialization day, e.g. "2018-09-12". Null selects from the
# complete configured holdout period.
case_study_initialization_date: null
case_study_variables: null
case_study_plot_variable: "${selected_variable}"


# Named files used by comparison plots and k-fold training. Numerical models are
# intentionally excluded from the neural-model training pool in scripts/train_kfold.py.
comparison_files:
  "GraphCast": "${data_dir}/graphcast_6steps_surf_1.5deg_2018-01-01_2018-12-31.nc"
  "IFS HRES": "${data_dir}/ifs_hres_6steps_surf_1.5deg_2018-01-01_2018-12-31.nc"
  "ERA5 Forecast": "${data_dir}/era5_forecast_6steps_surf_1.5deg_2020-01-01_2020-12-31.nc"
